<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartChoice Semey — Интеллектуальная профориентация</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Динамический неоновый анимированный фон -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>
  <div class="bg-grid"></div>

  <header>
    <div class="header-container">
      <div class="logo">
        <div class="logo-icon-wrapper">
          <span class="logo-icon">🎯</span>
        </div>
        <div class="logo-text">
          SmartChoice <span>Semey</span>
        </div>
      </div>
      <div class="location-badge">
        <span class="pulse-dot"></span> 📍 г. Семей
      </div>
    </div>
  </header>

  <main>
    <div class="card-wrapper">
      <div class="card-glow"></div>
      <div class="card" id="app">
        <!-- Контент динамически подгружается из script.js -->
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-content">
      <p>&copy; 2026 SmartChoice Semey. Платформа профессиональной ориентации и аналитики.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
